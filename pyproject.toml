[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlnd"
version = "2.0.0"
description = "Consecutive delivery network design with compatible order pairs and fixed mean resources"
requires-python = ">=3.11"
dependencies = [
  "gurobipy>=13.0",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "Pillow>=10.0",
  "scikit-learn>=1.4",
  "threadpoolctl>=3.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
mlnd = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"
pythonpath = ["."]
