[project]
name = "mlnd-od-aware"
version = "0.1.0"
description = "OD-aware multi-type facility location and drone network design"
requires-python = ">=3.11"
dependencies = [
  "gurobipy>=13.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
