[project]
name = "mlnd-od-aware"
version = "0.3.0"
description = "OD-aware chi-epsilon drone network design with aggregate energy sufficiency"
requires-python = ">=3.11"
dependencies = [
  "gurobipy>=13.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "Pillow>=10.0",
  "requests>=2.31",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
